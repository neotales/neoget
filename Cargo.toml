[workspace]
resolver = "3"
members = [
    "crates/neoget-config",
    "crates/neoget-core",
    "crates/neoget-engine",
    "crates/neoget-providers",
    "crates/neoget",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.98.1"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
